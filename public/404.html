<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="refresh" content="0; url=/Piletazo/" />
  </head>
  <body>
    <script>
      // Redirige cualquier ruta desconocida al index.html
      var redirectTo = "/Piletazo/";
      var current = window.location.pathname;
      if (current.startsWith(redirectTo)) {
        window.location.replace(redirectTo);
      } else {
        window.location.replace(redirectTo);
      }
    </script>
  </body>
</html>
